<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Scanner une bobine</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#152236;background:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;padding:16px 13px 35px}
main{max-width:540px;margin:auto}
h1{font-size:1.55rem;margin:4px 0 12px}
p{line-height:1.45}
.tag{color:#607084;letter-spacing:.07em;font-size:.71rem;font-weight:750;text-transform:uppercase}
.card{background:white;border:1px solid #dfe5eb;border-radius:16px;padding:15px;margin:13px 0;box-shadow:0 1px 5px #14243a09}
#status{font-size:1rem;font-weight:700;min-height:1.6em}
#status.scan-success{color:#168741}
video{display:block;width:100%;max-height:340px;aspect-ratio:4/3;border-radius:12px;object-fit:contain;background:#152236}
button{appearance:none;border:0;background:#00477c;color:white;border-radius:9px;padding:12px;font-weight:700;font-size:1rem;width:100%;cursor:pointer;margin:5px 0}
button.secondary{background:#e9eef5;color:#142236}button:disabled{opacity:.5;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-weight:650;margin:10px 0 5px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid #aab7c7;border-radius:8px;background:white}
#value{font-size:clamp(1.6rem,6vw,2rem);font-weight:800;letter-spacing:.03em;min-height:2rem;margin:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Scanner une bobine</h1></header>
<section class="card">
<div class="tag">1 — Lecture étiquette</div>
<p id="status" role="status">Chargement des décodeurs…</p>
<video id="video" autoplay muted playsinline></video>
<label for="camera">Caméra</label>
<select id="camera"><option value="">Caméra arrière automatique</option></select>
<div class="row"><button id="start">Activer la caméra</button><button id="stop" class="secondary" disabled>Arrêter</button></div>
<button id="list" class="secondary">Lister les caméras</button>
</section>
<section class="card">
<div class="tag">2 — Numéro de bobine</div>
<div id="value" aria-live="polite">—</div>
<label for="manual">Saisie manuelle de secours</label>
<input id="manual" type="text" inputmode="text" autocomplete="off" placeholder="Ex. T478540301">
<button class="secondary" id="useManual">Utiliser la saisie</button>
</section>
<section class="card">
<button id="send" disabled>Ouvrir la fiche bobine</button>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.js"></script>
<script>
'use strict';
const POWERAPPS_URL = 'https://apps.powerapps.com/play/e/default-2da651fa-07e9-4e14-8225-3979c556c063/a/81fbe4f7-ce8f-4592-ab96-1d712d44a0db?tenantId=2da651fa-07e9-4e14-8225-3979c556c063';
const byId = id => document.getElementById(id);
const video = byId('video'), status = byId('status'), send = byId('send');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', {willReadFrequently:true});
let stream = null, running = false, working = false, scannerToken = 0;
let nativeDetector = null, confirmedNumber = '', engineIndex = 0;
let lastAttempt = 0;
const engines = ['native','native','zbar']; // Priorité au natif : 2 passages sur 3 ; ZBar en secours.
const engineNames = {native:'Natif Edge',zbar:'ZBar'};
const available = {native:false,zbar:false};
// Diagnostics techniques conservés uniquement dans la console du navigateur.
function log(message) { console.info('[Scanner LISI]', message); }
function state(engine,message) { console.info('[Scanner LISI] '+engine+': '+message); }
// Lecture automatique : on exige le préfixe T des étiquettes LISI.
function getNumber(raw, manual=false) {
  const text = String(raw ?? '').trim();
  const expression = manual ? /^T?(\d{6,16})$/i : /^T(\d{6,16})$/i;
  const match = expression.exec(text);
  return match ? match[1] : '';
}
function acceptNumber(number, engine, raw, photo=false) {
  // Un seul décodage fiable du format LISI T + chiffres suffit.
  // L'ancienne logique exigeait 3 lectures ou 2 moteurs concordants :
  // une bobine pouvait être affichée par Natif Edge sans jamais être confirmée.
  confirmedNumber = number;
  byId('value').textContent = number;
  status.textContent = 'Bobine détectée';
  status.classList.add('scan-success');
  send.disabled = false;
  // La vibration se déclenche dès le premier code valide, comme dans l'ancienne version.
  try { if (navigator.vibrate) navigator.vibrate([100, 45, 100]); } catch (_) {}
  // Arrête immédiatement la caméra pour ne pas lire une autre étiquette.
  if (!photo) void stopCamera();
}
function registerCandidate(raw, engine, photo=false) {
  const clean = getNumber(raw);
  if (!clean) {
    if (raw) log(engineNames[engine]+' : autre contenu détecté '+JSON.stringify(String(raw).slice(0,80)));
    return false;
  }
  state(engine, 'T'+clean+' reconnu');
  log(engineNames[engine]+' a lu T'+clean+(photo?' (photo)':''));
  acceptNumber(clean, engine, raw, photo);
  return true;
}
async function initEngines() {
  if('BarcodeDetector' in window) {
    try {
      const formats=await BarcodeDetector.getSupportedFormats();
      const selected=['code_128','code_39'].filter(f=>formats.includes(f));
      if(selected.length){nativeDetector=new BarcodeDetector({formats:selected});available.native=true;state('native','Prêt ('+selected.join(', ')+')');}
      else state('native','Code 128/39 indisponible');
    }catch(e){state('native','Erreur : '+e.message);log('Natif : '+e.message);}
  } else state('native','Non disponible sur ce navigateur');
  if(typeof zbarWasm!=='undefined' && typeof zbarWasm.scanImageData==='function') {
    available.zbar=true;state('zbar','Prêt (chargement WASM au 1er scan)');
  }else state('zbar','Bibliothèque non chargée');
  const ready=engines.filter(e=>available[e]);
  status.textContent=ready.length?'En attente de scan':'Aucun lecteur disponible sur ce navigateur.';
  log('Moteurs disponibles : '+ready.join(', '));
}
function snapshot(source, maxDim=1700) {
  const w=source.videoWidth || source.width;
  const h=source.videoHeight || source.height;
  if(!w||!h)return false;
  const factor=Math.min(1,maxDim/Math.max(w,h));
  canvas.width=Math.max(1,Math.round(w*factor));
  canvas.height=Math.max(1,Math.round(h*factor));
  ctx.drawImage(source,0,0,canvas.width,canvas.height);
  return true;
}
async function decode(engine, c) {
  if(engine==='native'){
    const items=await nativeDetector.detect(c);
    return items.map(x=>({raw:x.rawValue,format:x.format}));
  }
  if(engine==='zbar'){
    const data=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height);
    const symbols=await zbarWasm.scanImageData(data);
    return Array.from(symbols||[]).map(x=>({raw:x.decode(),format:x.typeName || String(x.type||'')}));
  }
  return [];
}
async function decodeUsingEngine(engine, c, isPhoto=false) {
  const results=await decode(engine,c);
  for(const result of results){
    if(registerCandidate(result.raw,engine,isPhoto))return true;
  }
  return false;
}
async function stopCamera(){
  running=false;
  scannerToken++;
  if(stream){for(const track of stream.getTracks())track.stop();stream=null;}
  video.srcObject=null;
  byId('start').disabled=false;
  byId('stop').disabled=true;
}
async function tick(time, token){
  if(!running||token!==scannerToken)return;
  // Le natif reçoit 2 passages sur 3, ZBar prend le troisième.
  if(!working&&time-lastAttempt>=300&&video.readyState>=2){
    working=true;lastAttempt=time;
    try{
      if(snapshot(video)){
        let engine;
        for(let attempts=0;attempts<3;attempts++){
          const candidate=engines[engineIndex%engines.length]; engineIndex++;
          if(available[candidate]){engine=candidate;break;}
        }
        if(engine){
          try{await decodeUsingEngine(engine,canvas,false);}
          catch(e){state(engine,'Erreur : '+String(e.message||e).slice(0,90));log('Erreur '+engine+' : '+String(e.message||e).slice(0,140));available[engine]=false;}
        }
      }
    }catch(e){status.textContent='Erreur de lecture : '+e.message;log('Lecture : '+e.message);}
    finally{working=false;}
  }
  if(running&&token===scannerToken)requestAnimationFrame(t=>tick(t,token));
}
byId('start').addEventListener('click',async()=>{
  if(running)return;
  if(!navigator.mediaDevices?.getUserMedia){status.textContent='Caméra indisponible : ouverture HTTPS nécessaire.';return;}
  if(!engines.some(e=>available[e])){status.textContent='Aucun décodeur disponible. Vérifie le chargement des bibliothèques.';return;}
  try{
    // L'ID d'une caméra sélectionnée est enregistré localement sur ce téléphone.
    // Un identifiant n'est jamais codé en dur : il peut changer d'un appareil à l'autre.
    let preferred=byId('camera').value || readPreference(CAMERA_ID_KEY);
    let selectedCamera=preferred ? {deviceId:{exact:preferred},width:{ideal:1920},height:{ideal:1080}} :
      {facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}};
    try {
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:selectedCamera});
    } catch(e) {
      // En cas de réinitialisation des permissions ou changement de téléphone,
      // ne pas rester bloqué sur un ID périmé.
      if (!preferred || !['OverconstrainedError','NotFoundError'].includes(e.name)) throw e;
      log('Caméra enregistrée indisponible : '+e.name+'; retour à la sélection automatique.');
      clearPreference(CAMERA_ID_KEY);
      clearPreference(CAMERA_LABEL_KEY);
      byId('camera').value='';
      preferred='';
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    }
    video.srcObject=stream;await video.play();
    await listCameras(stream.getVideoTracks()[0]?.getSettings?.().deviceId || '');
    running=true;lastAttempt=0;engineIndex=0;
    byId('start').disabled=true;byId('stop').disabled=false;
    status.classList.remove('scan-success');
    status.textContent='Analyse des images avec les moteurs disponibles…';
    const token=++scannerToken;
    requestAnimationFrame(t=>tick(t,token));
  }catch(e){status.textContent='Caméra inaccessible : '+(e?.message||String(e));await stopCamera();}
});
byId('stop').addEventListener('click',()=>{void stopCamera();status.classList.remove('scan-success');status.textContent='Caméra arrêtée';});
// La préférence est uniquement enregistrée dans ce navigateur (pas dans GitHub ou Power Apps).
const CAMERA_ID_KEY='lisi_pref_camera_id_v1';
const CAMERA_LABEL_KEY='lisi_pref_camera_label_v1';
function readPreference(key){try{return localStorage.getItem(key)||'';}catch{return '';}}
function savePreference(key,val){try{localStorage.setItem(key,val);}catch{log('Mémoire caméra indisponible dans ce navigateur.');}}
function clearPreference(key){try{localStorage.removeItem(key);}catch{}}
async function listCameras(activeId=''){
  try {
    const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const sel=byId('camera');
    const current=sel.value;
    const savedId=readPreference(CAMERA_ID_KEY);
    const savedLabel=readPreference(CAMERA_LABEL_KEY);
    sel.innerHTML='<option value="">Caméra arrière automatique</option>';
    for (let i=0;i<devices.length;i++) {
      const d=devices[i];
      const opt=document.createElement('option');
      opt.value=d.deviceId;
      opt.textContent=d.label || ('Caméra '+i);
      sel.appendChild(opt);
    }
    const idInList=id=>id && devices.some(d=>d.deviceId===id);
    let target='';
    if(idInList(current)) target=current;
    else if(idInList(savedId)) target=savedId;
    else if(savedLabel) {
      const match=devices.find(d=>d.label && d.label===savedLabel);
      if(match) {target=match.deviceId;savePreference(CAMERA_ID_KEY,target);}
    }
    if(!target && idInList(activeId)) target=activeId;
    sel.value=target;
    log(devices.length+' caméra(s) trouvée(s), sélection : '+(sel.selectedOptions[0]?.textContent||'automatique'));
  }catch(e){log('Liste caméras : '+e.message);}
}
byId('list').addEventListener('click',async()=>{
  await listCameras();
  status.textContent='Caméras listées : choisis la caméra qui fonctionne.';
});
byId('camera').addEventListener('change',()=>{
  const sel=byId('camera');
  if(sel.value) {
    savePreference(CAMERA_ID_KEY,sel.value);
    savePreference(CAMERA_LABEL_KEY,sel.selectedOptions[0]?.textContent||'');
  }else{
    clearPreference(CAMERA_ID_KEY);clearPreference(CAMERA_LABEL_KEY);
  }
  if(running)status.textContent='Caméra modifiée : clique sur Arrêter puis Activer la caméra pour appliquer ce choix.';
});
function manual(){
  const text=byId('manual').value;const n=getNumber(text,true);
  if(!n){status.textContent='Saisis T suivi du numéro, ou le numéro seul (6 à 16 chiffres).';return;}
  confirmedNumber=n;
  byId('value').textContent=n;
  status.classList.remove('scan-success');
  status.textContent='Bobine saisie';send.disabled=false;
  void stopCamera();
}
byId('useManual').addEventListener('click',manual);
byId('manual').addEventListener('keydown',e=>{if(e.key==='Enter')manual();});
send.addEventListener('click',()=>{
  if(!confirmedNumber)return;
  const u=new URL(POWERAPPS_URL);
  if(u.protocol!=='https:'||u.hostname.toLowerCase()!=='apps.powerapps.com')return;
  u.searchParams.set('bobine',confirmedNumber);
  window.location.assign(u.toString());
});
window.addEventListener('pagehide',()=>{void stopCamera();});
void initEngines();
// Restaurer le choix mémorisé lorsque le navigateur a accès à la liste de caméras.
void listCameras();
</script>
</body>
</html>
